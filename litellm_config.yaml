# LiteLLM proxy config for the local sandbox.
# Start the proxy with:  dotenv run -- litellm --config litellm_config.yaml --port 4000
#
# `os.environ/VAR_NAME` tells LiteLLM to read the value from the environment,
# so no secrets live in this file. `dotenv run` loads .env first; the litellm
# CLI does not reliably find a .env in your working folder on its own.

model_list:
  # --- Mock model: no API key needed. Use it to check the proxy is wired up. ---
  - model_name: mock-model
    litellm_params:
      model: openai/mock-model
      api_key: not-needed
      mock_response: "Hello from the LiteLLM mock model! The proxy is working."

  # --- OpenAI ---
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # --- Anthropic ---
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Google Gemini (AI Studio key) ---
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true      # silently drop params a provider doesn't support
  num_retries: 2
  request_timeout: 60

general_settings:
  # Clients must send this as their API key (Authorization: Bearer <key>).
  master_key: os.environ/LITELLM_MASTER_KEY
