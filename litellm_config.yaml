# Zero-cost LiteLLM proxy config.
# Start the proxy with:  dotenv run -- litellm --config litellm_config.yaml --port 4000
#
# free-local needs Ollama running locally:  ollama pull llama3.2
# free-cloud needs a free OpenRouter key in .env:  OPENROUTER_API_KEY=...

model_list:
  - model_name: free-local
    litellm_params:
      model: ollama/llama3.2
      api_base: http://localhost:11434

  - model_name: free-cloud
    litellm_params:
      # OpenRouter's free auto-router: sends each request to a currently free
      # model, so it keeps working as individual :free models are retired.
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  # If free-cloud fails (e.g. 429 rate limit), retry the request on free-local.
  fallbacks:
    - free-cloud: ["free-local"]
  # Don't burn time retrying a rate-limited free endpoint: fall back immediately.
  retry_policy:
    RateLimitErrorRetries: 0

litellm_settings:
  drop_params: true
  request_timeout: 60

general_settings:
  master_key: sk-local-free
